[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/server",
    "crates/ui",
    "crates/domain",
    "crates/contracts",
    "crates/reader-core",
]
exclude = ["crates/app"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
strip = "debuginfo"
