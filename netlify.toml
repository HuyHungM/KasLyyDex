"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  base = "web"
  command = "cargo install wasm-bindgen-cli --version 0.2.130 --locked && rustup target add wasm32-unknown-unknown && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  RUSTUP_TOOLCHAIN = "stable"
