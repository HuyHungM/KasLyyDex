[package]
name = "ui"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", features = ["http"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures = "0.3"
console_error_panic_hook = "0.1"
send_wrapper = "0.6"
web-sys = { version = "0.3", features = [
  "Window", "Storage", "Location", "Element", "NodeList", "HtmlSelectElement",
  "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit",
  "KeyboardEvent", "Event", "EventTarget", "Document", "DomRect", "PointerEvent",
] }
